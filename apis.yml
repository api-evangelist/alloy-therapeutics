name: Alloy Therapeutics
description: >-
  Alloy Therapeutics is a biotechnology ecosystem company operating as a Product
  Development Organization that partners across discovery, preclinical, and clinical
  development. It combines proprietary AI/ML, real-world data, and tech-enabled
  scientific services across multiple therapeutic modalities, including monoclonal
  and bispecific antibodies, TCR mimics, genetic medicines (cyclic RNA and
  oligonucleotide design), and cell-therapy pharmacology. Alloy is known for its
  transgenic antibody-discovery platforms (the ATX-Gx mouse series) and licenses
  reagents, platforms, and services to pharmaceutical and biotech partners rather
  than exposing a public developer API. Surfaced as a portfolio company of 8vc and
  added to the API Evangelist network for enrichment.
